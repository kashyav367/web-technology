           -> Grouping a set related items is known as list.

                1.Ordered list : 
                   ● Arranging the item into an ascending or descending order.
                   ● <ol>, <li>
                   ● Syntax: 
                        <ol>
                            <li>items</li>
                            <li>items</li>
                            <li>items</li>
                            <li>items</li>
                            <li>items</li>
                        </ol>
                    ● Attributes: 
                         1.type: 1(default),A,a,I,i
                         2.start: defines from which number list should start
                         3.reversed: Reverses the list marker.    
                2.Unordered list: 
                 ● Syntax: 
                        <ul>
                            <li>items</li>
                            <li>items</li>
                            <li>items</li>

                        </ul>
