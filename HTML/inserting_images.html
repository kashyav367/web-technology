<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 💠 🏹 
       Inserting images
     -> To insert image, use <img> tag.
     -> It is a single tag, void element
     -> It is inline element
     -> Used to insert static images.
     -> Preferably .webp images should be used in web page (webp high quality low size)
     -> Syntax: 
        <img src="" alt="">
     -> Attributes: 
          1.src - source : Name/path/URL of the image
          2.alt - alternate: Describes the alternative name given to image to enhance screen readibility .
                             It works in the absence of source
          3.height & width - px, %.
          4.title

   -->

   <!-- 1. By using name -->
    <img src="/crane.jpg" alt="crane" height="400px">

    <!--2. By using path -->
    <img src="./assets/images/Mac.jpg" alt="Mac"  height="400px">
    <img src="./assets/images/flowers.jpg" alt="flowers" height="400px">
</body>
</html>
