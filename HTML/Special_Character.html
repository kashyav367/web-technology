<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        => Special Characters 
             -> HTML allows developer to insert any type of special character into the web page.
             -> We can embed such type of special characters that are not available in keyword.
             -> can insert UTF-8 charcters, mathematical, logical, currency, arrow,symbols, alphabets and many more ...
             //in interview html entity -> it is the entity which allows special characters to insert
             ->Syntax
                    &Ebtity_name; OR &#Entity_number;

    -->
      <!--Required special chaarcters-->
    <!--Currency Symbols -->
    <span>&#8352</span>
    <span>&#8371</span>
    <!--Arrows-->
     <span>&#8592</span>
     <span>&#8595</span>
    <!--Number Forms-->
     <span>&#8528</span>
     <span>&#8531</span>
    <!--Enclosed Alphanumeric-->
    <span>&#9312</span>
     <span>&#9314</span>
    
    <!--Weather Symbols-->
    <span>&#9729;</span>
    <span>&#9959;</span>
    <!--Musical Symbols-->
    <span>&#9834;</span>
    <span>&#9836;</span>
    <!--Dingbats-->
     <span>&#9992;</span>
    <span>&#9993;</span>
    <!--Math Operators-->
    <span>&#8704;</span>
    <span>&#8712;</span>
</body>
</html>
