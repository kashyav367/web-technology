        <!--
          ☯  Form
              -> Forms are used to collect data from user.
              -> HTML allows the developer to create form using <form></form>
              -> We can create login, sign in, registration, sign up, payment etc...
              -> We can collect text, password, number, email, url, files,date,time,color by provide
              controls like buttons, radio button, checkbox and dropdown menus.
              -> Form can aligned by creating it using table without css.
              -> Syntax : 
                    <form action="" method=""> // method will be wither get and post 
                        Form element
                    </form>   


             -> Form elements
            1.label:
               - used to identify input fields.
               - Syntax: 
                    <label for=""> Content </label>
                  
            2.input: 
               - used to collect different types of input data from the user, by changing "type"
               attribute.
               - Unpaired and inline element
               - Syntax: 
                    <input type="" name="" id="">
               - Attributes: 
                    1.type : Accepts different input - text, password, etc..
                    2. name : Identifies the field to send data to backend
                    3.id : Identification of input element.
                    4. placeholder: Given text format identification to field. 
                    5.minlength: Defines minimum character entered into the field
                    6.maxlength: Decide the maximum number of characters into the field
                    7.value :  Holds the input values entered by user.
                    8. required: Make the input field as mandatory.
                    9. disabled : disables input field from entering value
                    10. readonly : Cant enter the value, but can read.
                    11. checked : Used to select radio button and checkbox default.
                    12.pattern : Provides regular expression pattern to particular input.
                    13.autofocus : Selects input to add value default

                 * Radio button: 
                     => Allows user to choose limited options i.e one at a time.
                     => Example : Choosing gender, Choosing IT domain, payment modes in E-commerce   

                 * Check Box: 
                     => Allows the user to select more than 1 option
                     => Example: Selecting Skills, Selecting preferred location

                 *  Dropdown/Combo box
                    => <select> tag allows developer to create dropdown and <option> allows to create menu. 
                    => It facilitates user to select one option from displayed menu.
                    => option are predefined, that can't modified later and can't enter user defined values.
                    => Example: Selecting country, state, district, YOP , etc..
                    => Syntax :
                        <select> 
                          <option value="item">Item</option>    
                          <option value="item">Item</option>  
                          <option value="item">Item</option>  
                          <option value="item">Item</option>  
                        </select>
                * Attributes: 
                      1.hidden : hides an option from the list, so user cant choose it.
                      2.selected : selects an option defaultly

                 * Datalist: 
                      => It allows user to select predefined options as well as user can enter value.
                      =>  <input> is used to enter value and <datalist> with <option> defines the datalist 
                           datas.
                      =>Example : Searching products in E-Commerce app.
                      => Syntax : 
                           <input type="text" id="list_name  name="" >
                           <datalist list="list_name">
                               <option value=""> 
                               <option value=""> 
                               <option value=""> 
                            </datalist>

                 * Textarea : 
                       => Textarea allows user to enter long text . 
                       => <textarea> used to accept long text.
                       => Example: feedback, comments, prompts, reviews, etc. 
                       => Syntax: 
                              <textarea id="" name="" cols="" rows="" ></textarea>           
        -->
