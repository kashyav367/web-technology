<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
      ➤ Shadow 
       ❄ This property is used to apply shadow around the HTML elements.
       ❄ Types: 
            1. box-shadow: 
               -> This is prop is used to apply shadow around boxes, images with background, video.
               -> Syntax: 
                    selector{
                        box-shadow : val1 val2 val3 val4 val5 inset;
                    }
                        
                    * val1: adds shadow at right side, if value(px) is -ve changes its direction to left.
                    * val2: adds shadow at bottom side, if value(px) is -ve changes its direction to top.
                    * val3: Scatters the shadow.
                    * val4: Cover the shadow in all direction.
                    * val5 : defines shadow color.
                    * inset : Optional property to apply shadow inside the box.
           2. drop=shadow: 
                  -> This prop apply shadow to transparent background images.
                  -> Syntax: 
                       selector{
                           filter:drop-shadow(val1 val2 val3 val4)
                       }
           3.text-shadow: 
                  -> This prop apply shadow to text document
                  -> Syntax: 
                        selector{
                          text-shadow: val1 val2 val3 color;
                        }        
                    
    -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Isometra&display=swap');
        body{
            background-color: rgb(193,193,255);
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        .wrapper{
            height: 350px;
            width: 350px;
            margin: auto;
            margin-top: 10%;
            background-color: snow;
        }

        .shadow-two-side {
            box-shadow: 50px -50px 30px rgba(0, 0, 0.4);
        }

        .shadow-all-side{
            box-shadow: 0px 0px 30px 15px rgba(0,0,0);
        }

        .shadow-multi-layer{
            box-shadow: 0px 0px 20px 20px lime, 0px 0px 20px 40px magenta, 0px 0px 10px 60px cyan;
        }

        .shadow-in-side{
            box-shadow: 0px 0px 10px 5px rgba(0,0,0) inset;
        }

        img{
           width:90%;
           text-align: center;
           margin-top: 30px;
           /* margin-left: 30px;
           box-shadow: 0px 0px 10px 5px black; */
           filter:drop-shadow(40px 10px 10px black)
        }

        .drop-shadow{
            background-color: transparent;
        }
        h1{
            font-size: 5rem;
            text-align: center;
            font-family: "Isometra", serif;
            font-weight: 900;
            letter-spacing: 10px;
            color: orangered;
            text-shadow: 7px 3px 5px black;
        }

    </style>

    <div class="wrapper shadow-two-side"></div>
    <div class="wrapper shadow-all-side"></div>
    <div class="wrapper shadow-multi-layer"></div>
    <div class="wrapper shadow-in-side"></div>
    <div class="wrapper drop-shadow">
     <img src="lion.png" alt="">
     </div>
     <h1> I ❤️ BENGALURU</h1>
</body>
</html>
