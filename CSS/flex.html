<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>

    <style>
       body{
        background-color: burlywood;
      }

      *{
        margin: 0;
        box-sizing: border-box;
      }

      .wrapper{
        height: 100vh;
        width: 75%;
        background-color: thistle;
        display: flex;
        /* justify-content: center; */
        align-items: center;
        justify-content: space-evenly; 
        flex-wrap: nowrap;
        flex-wrap: wrap;

        /* Works only with flex wrap*/
        align-content: space-evenly;     

      }

      .wrapper >.item{
        height: 140px;
        width: 140px;
        background-color: aliceblue;
        box-shadow: 0px 0px 7px 4px rgba(0, 0, 0, 0.585) inset;
        font-size: 2.3rem;
      }

      .wrapper >.item:first-child{
        background-color: blue;
        order: 3;
      }
      .wrapper >.item:nth-child(2){
        background-color: red;
        order:4;
      }
      .wrapper >.item:nth-child(3){
        background-color: yellowgreen;
        order: 1;
        /* flex-shrink: 2; */
      }
      .wrapper >.item:nth-child(4){
        background-color: blueviolet;
        order: 2;
        /* flex-grow: 1; */
      } 

      .two {
        background-color: yellow;
      }

      .wrapper >.item:hover{
        flex-grow: 1;
      }

      /* .main{
        background-color: cadetblue;
        height:100vh;
        width:100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .main>.sub-main{
        background-color: cornflowerblue;

      .main .part{
        background-color: aqua;
        height: 50%;
        width:100%;
      }

     .main .bottom{
        background-color: cadetblue;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
      }

     .main .bottom>.item{
        height: 80%;
        width: 46%;
        background-color: springgreen;
     } */

    </style>
</head>
<body>
     <!--
       flex
       -- Stands for flexible box
       -- It makes element as inline-level block container
       -- Handles the element in row-wise or col-wise 
           so it is one-dimensional.
       -- Creates a relation ship of parent - child and wraps all child elements within it
       -- Mainly used in maintaining spaces 
       -- and to make web page as responsive 
       
       
       flex-properties 
        -- flex-direction :  row
        -- flex-direction :  row-reverse
        -- flex-direction :  column
        -- flex-direction :  column-reverse


        --align-items : flex-start;
         --align-items : flex-end;
          --align-items : center;

          
        --justify-content : flex-end;
        -- justify-content : flex-start;
        -- justify-content : space-around;
        -- justify-content : space-between;
        -- justify-content : space-evenly;
        -- justify-content : center;

        //gap
       -- column-gap: 5px;
       --  row-gap : 5px;
     -->

      <div class="wrapper">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div> 
      
      <div class="wrappertwo"></div>

</body>
