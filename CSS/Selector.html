<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    Selectors : 
    * Selector is an method to target an html element to apply CSS.
    * Syntax: 
        selector{
            css prop
        }
    * Types
        1. Basic Selector 
            a.Tag Selector ;
                 -> Targeting an HTML element using its tag name.
                 -> Syntax : 
                       tag {
                          //css prop -- cutt
                       }

            b.id Selector
                -> Selecting an HTML element by using attribute "id".
                -> Used to identify an HTML element by providing unique identification
                -> Id should't be duplicated
                -> Uses # to identify element
                -> Syntax: 
                   #id_name{
                     CSS prop
                   }
                   <tag id="id_name"></tag>  
            c. class Selector: 
                 -> Selecting an HTML element by using "class" attribute.
                 -> Class can be duplicated and can be used for any number of times.
                 -> Creating the sub class is allow
                 -> Uses '.' followed by class name.
                 -> Syntax: 
                     .class_name{
                       //CSS PROP - CUTT
                     }
                    <tag class="class_name">Content</tag> 
            d. Attribute Selector: 
                 -> Selecting an html element by using its attribute to apply css property.
                 -> Commonly used in form elements and hyper link selection.
                 -> Syntax : 
                        input[attribute="value"]{
                          
                        }
                -> For hyperlink selection starts with - ^, contains - *, endswith- $ */
                     Example : if url starts with "https:"
                               a[href^="https:"]{
                                    color: #FFD51E;
                                    font-weight: 900;
                               }
            f.Group Selector
                 -> Selecting multiple elements to apply common css property, by using operator ','
                    between selectors
                 -> Syntax: 
                      sel1, sel2, sel3, ....{
                        
                      }   
            g.Universal Selector.
                  -> Selects all html element to apply same css property.
                  -> Uses '*' to select all element.
                  -> Syntax : 
                       }
            
            
        2. Combinators 
           a.Descendant
           b. Child 
           c. Adjacent Sibling / Next child
           d.General Sibling / all child Selectors
           
       3. Psuedo-class
          a.link
          b.active
          c.Visited
          d.hover
          e.focus
          f.first-child
          g.last-child
          h.nth-child()
          i.nth-child(even/odd)
          j.has()
          k.not()
          l.checked()
          m.root
          
       4.Psuedo-elements 
         a.first-letter
         b.first-line
         c.before
         d.after
         e.Selection
         f.marker
         g.placeholder
    -->

    <style>

        /* Universal selector */
        *{
            box-sizing: border-box;
            margin: 0;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        /* Tag Selector */
        h1{
            color: red;
        }

        /* Id */
        #heading {
            color: aqua;
        } 
        /* class */
        .heading-text{
            color: rgb(129,110,86);
            font-size: 40px;
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(193,227,126);
            text-transform: uppercase;
        }
        .sub-text{
            color: blueviolet;
        }
        .normal-text{
            color: salmon;
        }
    </style>

    <!-- Tag selector -->
     <h1>This is H1 element</h1>
     

     <!--id selector -->
     <h1 id="heading-text">This is H1 element</h1>

     <!--class selector -->
    <h1 class="heading-text">This is H1 element</h1>
    <h1 class="heading-text sub-text">This is H1 element</h1>
    <p class="heading-text normal-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus error soluta quaerat similique explicabo et fugiat nostrum dicta, accusantium maiores?</p>

    <hr>

    <style>
        #user-reg{

        .user-input{

            border-color: #3E0F8D;
        }

        input[type="email"]{

        }


        input[type="submit"]{
            background-color: #00B7CD;
            border: none;
            height:35px;
            width: 150px;
            font-weight: 700;
            font-size: 20px;
        }

        p{
            color: #D8FFC5;
        }

        }

        /* starts with - ^, contains - *, endswith-$*/

        a[href^="https:"]{

            font-weight: 900;
        }
    </style>

    <form action="" id="user-reg">
        <input type="text" name="" id="" class="user-input" placeholder="username"><br><br>
         <input type="password" name="" id="" class="user-input" placeholder="password"><br><br>
          <input type="email" name="" id="" class="user-input" placeholder="mail"><br><br>
          <input type="submit" value="Submit">
          <p>Forgot password? <a href="https://qspiders.com/branches/btm-jspiders?branchId=8-branchId">reset </a> here </p>

          </a>
    </form>
</body>
