<!-- 
     Pseudo-class:
       - Pseudo classes are used to change the state of whole HTML element.
       - Can change the state of elements on the basis of links availability, user interaction, postion of
       element on the DOM and more.
       - Syntax:
           selector:pseudo-class{
              cs prop
           }
       - Types:
          1. link : To change the state of unvisited links on the web page.
          2. visited : to change the status of visited links.
          3. active : To change the status of active links When user click and hold on link.
          4.hover : To change the state of HTML element, when user takes cursor over it.
          5.focus: To change the state of HTML element (most likely input) when element gets focus
          // both hover and focus used for user interaction 
          6.first-child: Selects first available element.
          7.last-child: Selects last element from selected selector.
          8.nth-child(): Selects elements based on the number
          9.nth-child(evem/odd): Selects only even/odd numbered element
-->
      <style>
        input{
            height: 35px;
            width: 350px;
            border: 2px solid;
            /* border-color: transparent transparent red transparent */
            margin-left: 40%;
            outline: none;
            font-size: 1.2rem;
            padding-left: 20px;
        }
        input:focus{
        /* border-color: transparent transparent limegreen transparent */
        border: limegreen;
        box-shadow: 0px 0px 20px 3px rgba(50,205,50,0.777);
        }
        
      </style>
      <input type="text" name="" id="" placeholder="Type here.....">     

      <!--First child -->
      <style>
        .text > h1:first-child{
            color: violet;
            background-color: turquoise;
            font-size: 3rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .text > h1:last-child{
            color:blueviolet;
              background-color: turquoise;
            font-size: 3rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .text>h1:nth-child(even){
            color: steelblue;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 3rem;
        }
      </style>
