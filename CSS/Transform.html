<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
     Transform 
     > Transform is used to transform an html element into 2D or 3D.
     > We can rotate, resize, bend and drag element based on X,Y and Z - axis.
     > Types
       1. Rotate() - Used to rotate an HTML element along  X,Yand Z.
       2. Scale() -     Used to resize selected element along with X,Y axis value 1 is neutral
       3. Skew() -   used to bend selected element.
       4. Translate() - Used to drag the selected element along with X and Y axis
     Transition 
     > Change in the CSS property over given of time.
     > Transition: transition-property duration timing-function delay;
    
    -->
       <style>

          *{
            margin: 0;
          }

          .parent {
            min-height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;
            background-color: gray;
          }
          .parent>.card{
            height: 300px;
            width: 300px;
            background-color: brown;
            border: 1px black solid;
            transition: transform 5s linear;
          }
          .card:nth-child(1):hover{
             transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            /* transform: rotateY(360deg);
             transform: rotateZ(360deg); */
            
          }
          .card:nth-child(2):hover{
            transform: scaleX(1.3);
            transform: scaleY(1.3);
            transform: scale(1.3);
          }
          
          img-wrap{
            height: 300px;
            width: 300px;
            background-color: aliceblue;
            overflow: hidden;
          }

          img{
             height: 300px;
             width: 300px;
             object-fit: cover;
             transform: scale(2);
          }

          img:hover{
            transform: scale(1);
            transition: transform 200ms linear;
          }

         .card:nth-child(4):hover{
            transform: skewX(-10deg);
            transform: skewY(-10deg);
          }

          .card:nth-child(4):hover{
            transform: skewX(-10deg);
            transform: skewY(-10deg);
          }

           .card:nth-child(5):hover{
            transform: translateX(-100px);
            transform: translateY(-100px);
            transform: translate(-100px,-100px);
          }

       </style>
       <div class="parent">
           <div class="card"></div>
           <div class="card"></div>
           <div class="img-wrap">
            <img src="https://images.pexels.com/photos/19019729/pexels-photo-19019729.jpeg" alt="">
           </div>
           <div class="card"></div>
            <div class="card"></div>
       </div>
</body>
</html>
